[project]
name = "crew_stock_picker"
version = "0.1.0"
description = "crew-stock_picker using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.30,<2.0.0"
]

[project.scripts]
crew_stock_picker = "crew_stock_picker.main:run"
run_crew = "crew_stock_picker.main:run"
train = "crew_stock_picker.main:train"
replay = "crew_stock_picker.main:replay"
test = "crew_stock_picker.main:test"
run_with_trigger = "crew_stock_picker.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "cd8ef986-72f0-4601-8925-1a66e5c1bae4"
